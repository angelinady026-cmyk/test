<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 💌</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:12px;
    overflow:hidden;
    background:radial-gradient(circle at top,#fffaf1,#f1dfc7 65%,#e3c9aa);
    color:#432f2b;
    font-family:Georgia,"Times New Roman",serif;
}

.scene{width:min(96vw,1100px)}

.card{
    position:relative;
    width:100%;
    height:min(72vw,650px);
    min-height:400px;
    max-height:86vh;
    perspective:2400px;
}

/* The card itself */
.card-shell{
    position:absolute;
    inset:0;
    overflow:hidden;
    border-radius:18px;
    background:#f6ead8;
    box-shadow:0 25px 45px rgba(60,40,25,.25);
}

/* Two-page interior */
.inside{
    position:absolute;
    inset:0;
    display:grid;
    grid-template-columns:1fr 1fr;
    background:#f7eddd;
}

.page{
    position:relative;
    min-width:0;
    min-height:0;
    overflow:hidden;
    background:#f7eddd;
}

.page + .page{
    border-left:2px solid rgba(90,60,40,.16);
}

/* ALL PHOTOS: NEVER CROP */
.photo{
    display:block;
    width:100%;
    height:100%;
    object-fit:contain;
}

/* ---------------- COVER ---------------- */

.cover{
    position:absolute;
    inset:0;
    z-index:50;
    overflow:hidden;
    cursor:pointer;
    transform-origin:left center;
    transform-style:preserve-3d;
    transition:transform 1.15s cubic-bezier(.2,.78,.2,1);
    border-radius:18px;
    background:#f6ead8;
    backface-visibility:hidden;
    box-shadow:8px 0 22px rgba(50,30,20,.15);
}

.card.open .cover{
    transform:rotateY(-180deg);
    pointer-events:none;
}

.cover .photo{
    background:#f6ead8;
}

.cover-hint{
    position:absolute;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    padding:10px 18px;
    border-radius:999px;
    background:rgba(255,250,241,.96);
    box-shadow:0 7px 18px rgba(50,30,20,.18);
    font:700 12px Arial,sans-serif;
    white-space:nowrap;
    animation:pulse 2.3s infinite;
}

@keyframes pulse{
    50%{transform:translateX(-50%) scale(1.05)}
}

/* ---------------- LETTER ---------------- */

.seal{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:20;
    width:78px;
    height:78px;
    border-radius:50%;
    border:3px solid #963d49;
    background:radial-gradient(circle at 35% 30%,#df7b83,#a33f4a);
    color:#fff;
    font:700 10px Arial,sans-serif;
    cursor:pointer;
    box-shadow:0 10px 25px rgba(80,30,35,.3);
    animation:sealPulse 2.5s infinite;
}

@keyframes sealPulse{
    50%{box-shadow:0 10px 32px rgba(160,60,70,.5)}
}

.letter-open{
    position:absolute;
    inset:5%;
    z-index:25;
    opacity:0;
    transform:scale(.96);
    transition:.6s ease;
    pointer-events:none;
}

.letter-open.show{
    opacity:1;
    transform:scale(1);
}

/* ---------------- MEMORY PAGE ---------------- */

.memory-page{
    position:absolute;
    inset:0;
}

.spark{
    position:absolute;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 12px #fff;
    pointer-events:none;
    animation:float 4s ease-in-out infinite;
}

.s1{left:12%;top:18%}
.s2{right:15%;top:25%;animation-delay:1s}
.s3{left:28%;bottom:17%;animation-delay:2s}
.s4{right:10%;bottom:22%;animation-delay:2.8s}

@keyframes float{
    50%{transform:translateY(-12px) scale(1.3);opacity:.3}
}

/* ---------------- REAL PAGE TURN ----------------
   This is ONE sheet.
   Its front = memories.
   Its back = flowers.
-------------------------------------------------- */

.page3-sheet{
    position:absolute;
    inset:0;
    z-index:40;

    transform-origin:left center;
    transform-style:preserve-3d;

    transition:
        transform 1.15s cubic-bezier(.2,.78,.2,1);

    backface-visibility:hidden;
}

.page3-sheet.turned{
    transform:rotateY(-180deg);
}

/* Front of the physical sheet = Page 3 */
.sheet-front,
.sheet-back{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:#f7eddd;
    backface-visibility:hidden;
}

.sheet-front{
    transform:rotateY(0deg);
}

/* Back of the physical sheet = Page 4 */
.sheet-back{
    transform:rotateY(180deg);
}

/* ---------------- FLOWER PAGE ---------------- */

.flower-page{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:#f6ead8;
}

/* Before reveal */
.flower-before{
    position:absolute;
    inset:0;
    opacity:1;
    transition:opacity 1s ease;
}

/* Actual/revealed flower image */
.flower-real{
    position:absolute;
    inset:0;
    opacity:0;
    transform:scale(1.02);
    transition:
        opacity 1.1s ease,
        transform 1.2s ease;
}

.flower-page.revealed .flower-before{
    opacity:0;
}

.flower-page.revealed .flower-real{
    opacity:1;
    transform:scale(1);
}

/* Small flower animations */
.bloom{
    position:absolute;
    width:20px;
    height:20px;
    border-radius:50%;
    background:#fff8e9;
    box-shadow:0 0 0 6px rgba(255,255,255,.2);
    animation:sway 3.5s ease-in-out infinite;
    transition:opacity .5s;
}

.bloom:before,
.bloom:after{
    content:"";
    position:absolute;
    inset:5px;
    border-radius:50%;
    background:#e8a0a7;
}

.bloom:before{transform:rotate(45deg)}
.bloom:after{transform:rotate(-45deg)}

.b1{left:14%;top:20%}
.b2{right:14%;top:26%;animation-delay:.7s}
.b3{left:28%;bottom:18%;animation-delay:1.4s}
.b4{right:11%;bottom:22%;animation-delay:2s}

.flower-page.revealed .bloom{
    opacity:0;
}

@keyframes sway{
    50%{transform:translateY(-8px) rotate(8deg)}
}

/* ---------------- IN-CARD CONTROLS ---------------- */

.nav{
    position:absolute;
    z-index:80;
    border:0;
    border-radius:999px;
    padding:9px 13px;
    background:rgba(255,250,241,.96);
    color:#432f2b;
    box-shadow:0 7px 17px rgba(55,35,25,.16);
    font:700 11px Arial,sans-serif;
    cursor:pointer;
}

.close{
    left:10px;
    top:10px;
}

.turn{
    right:10px;
    top:10px;
}

.back{
    left:10px;
    top:10px;
}

/* Blow instruction only appears on Page 4 */
.blow{
    position:absolute;
    z-index:90;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    width:min(80%,370px);
    padding:12px 15px;
    border-radius:17px;
    background:rgba(255,249,238,.96);
    box-shadow:0 9px 22px rgba(55,35,25,.18);
    text-align:center;
    font:600 12px Arial,sans-serif;
    cursor:pointer;
    animation:blowPulse 2.5s ease-in-out infinite;
}

@keyframes blowPulse{
    50%{transform:translateX(-50%) scale(1.03)}
}

.meter{
    height:6px;
    margin-top:8px;
    border-radius:99px;
    overflow:hidden;
    background:#ead8c8;
}

.meter span{
    display:block;
    width:0;
    height:100%;
    background:#b75c62;
}

/* ---------------- MOBILE ---------------- */

@media(max-width:700px){
    body{padding:7px}

    .card{
        height:78vh;
        min-height:410px;
    }

    .cover-hint{
        font-size:10px;
    }

    .seal{
        width:62px;
        height:62px;
        font-size:9px;
    }

    .nav{
        font-size:9px;
        padding:8px 10px;
    }
}
</style>
</head>

<body>

<div class="scene">

<div class="card" id="card">

    <!-- THE TWO-PAGE INTERIOR -->
    <div class="card-shell">

        <div class="inside">

            <!-- ================= PAGE 2 ================= -->
            <section class="page">

                <button
                    class="nav close"
                    onclick="closeCard()">
                    ↩ Close
                </button>

                <img
                    class="photo"
                    src="letter.png"
                    alt="Letter">

                <button
                    class="seal"
                    id="seal"
                    onclick="openLetter()">
                    OPEN<br>THE SEAL
                </button>

                <div
                    class="letter-open"
                    id="letterOpen">

                    <img
                        class="photo"
                        src="letter-open.png"
                        alt="Opened letter">

                </div>

            </section>


            <!-- ================= PAGE 3 + PAGE 4 ================= -->
            <section class="page">

                <!--
                    ONE physical sheet.
                    Front = memories.
                    Back = flowers.
                -->
                <div
                    class="page3-sheet"
                    id="page3Sheet">

                    <!-- FRONT: PAGE 3 -->
                    <div class="sheet-front">

                        <div class="memory-page">

                            <img
                                class="photo"
                                src="memories.png"
                                alt="Memories">

                            <span class="spark s1"></span>
                            <span class="spark s2"></span>
                            <span class="spark s3"></span>
                            <span class="spark s4"></span>

                            <button
                                class="nav turn"
                                onclick="turnToFlowers()">
                                Turn page →
                            </button>

                        </div>

                    </div>


                    <!-- BACK: PAGE 4 -->
                    <div class="sheet-back">

                        <div
                            class="flower-page"
                            id="flowerPage">

                            <!-- FLOWERS BEFORE BLOW -->
                            <img
                                class="flower-before photo"
                                src="flowers.png"
                                alt="Flowers">

                            <!-- REAL FLOWERS AFTER BLOW -->
                            <img
                                class="flower-real photo"
                                src="flowers-revealed.png"
                                alt="Real flowers">

                            <!-- SMALL ANIMATIONS -->
                            <div class="bloom b1"></div>
                            <div class="bloom b2"></div>
                            <div class="bloom b3"></div>
                            <div class="bloom b4"></div>

                            <button
                                class="nav back"
                                onclick="returnToMemories()">
                                ← Memories
                            </button>

                            <!-- BLOW CONTROL -->
                            <div
                                class="blow"
                                id="blow">

                                <b id="blowText">
                                    🌬️ Tap here, then blow gently
                                </b>

                                <div class="meter">
                                    <span id="meter"></span>
                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </section>

        </div>

    </div>


    <!-- ================= PAGE 1 ================= -->
    <div
        class="cover"
        id="cover"
        onclick="openCard()">

        <img
            class="photo"
            src="cover.png"
            alt="Front cover">

        <div class="cover-hint">
            Open me 💌
        </div>

    </div>

</div>

</div>


<script>

/* ================= CARD ================= */

const card =
    document.getElementById("card");

function openCard(){
    card.classList.add("open");
}

function closeCard(){
    card.classList.remove("open");
}


/* ================= LETTER ================= */

function openLetter(){

    document
        .getElementById("letterOpen")
        .classList.add("show");

    document
        .getElementById("seal")
        .style.opacity = ".25";
}


/* ================= PAGE 3 → PAGE 4 ================= */

const page3Sheet =
    document.getElementById("page3Sheet");

function turnToFlowers(){

    /*
      Page 3 is the FRONT of the physical sheet.
      Rotating it reveals Page 4,
      which is the BACK of that same sheet.
    */

    page3Sheet.classList.add("turned");
}

function returnToMemories(){

    page3Sheet.classList.remove("turned");
}


/* ================= MICROPHONE ================= */

const blow =
    document.getElementById("blow");

const blowText =
    document.getElementById("blowText");

const meter =
    document.getElementById("meter");

const flowerPage =
    document.getElementById("flowerPage");

let listening = false;
let score = 0;


async function startMicrophone(){

    if(listening){
        return;
    }

    listening = true;

    try{

        const stream =
            await navigator.mediaDevices.getUserMedia({
                audio:true
            });


        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        const audioContext =
            new AudioContext();


        const analyser =
            audioContext.createAnalyser();


        analyser.fftSize = 512;


        const microphone =
            audioContext
                .createMediaStreamSource(stream);


        microphone.connect(analyser);


        const data =
            new Uint8Array(
                analyser.fftSize
            );


        blowText.textContent =
            "🌬️ Blow gently...";


        function listen(){

            analyser.getByteTimeDomainData(data);


            let sum = 0;


            for(
                const value of data
            ){

                const v =
                    (value - 128) / 128;

                sum += v * v;
            }


            const rms =
                Math.sqrt(
                    sum / data.length
                );


            const level =
                Math.min(
                    100,
                    Math.max(
                        0,
                        (rms - .035) * 850
                    )
                );


            meter.style.width =
                level + "%";


            if(level > 40){

                score +=
                    level / 100;
            }


            /*
              Once she has blown enough,
              reveal the real flowers.
            */

            if(score >= 18){

                flowerPage
                    .classList
                    .add("revealed");


                blowText.textContent =
                    "✨ The flowers bloomed for you ✨";


                stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );


                listening = false;

                return;
            }


            requestAnimationFrame(
                listen
            );
        }


        listen();

    }
    catch(error){

        blowText.textContent =
            "🎤 Allow microphone access, then tap again.";

        listening = false;
    }
}


/* Only Page 4 has the microphone interaction */

blow.addEventListener(
    "click",
    startMicrophone
);


/* ================= SWIPE ================= */

let startX = 0;


document.addEventListener(
    "touchstart",
    event => {

        startX =
            event.changedTouches[0].clientX;

    },
    {passive:true}
);


document.addEventListener(
    "touchend",
    event => {

        const endX =
            event.changedTouches[0].clientX;

        const distance =
            endX - startX;


        if(
            Math.abs(distance) > 60 &&
            card.classList.contains("open")
        ){

            if(distance < 0){

                turnToFlowers();

            }
            else{

                returnToMemories();

            }
        }

    },
    {passive:true}
);

</script>

</body>
</html>
